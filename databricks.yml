bundle:
  name: nba_analytics

variables:
  catalog:
    description: Unity Catalog catalog that receives the bronze/silver/gold schemas
    default: nba_test1
  warehouse_name:
    description: Name of the SQL warehouse that powers the dashboard
    default: sql_warehouse_2x_small
  warehouse_id:
    description: SQL warehouse id (resolved from warehouse_name)
    lookup:
      warehouse: ${var.warehouse_name}

resources:
  jobs:
    nba_games_pipeline:
      name: nba_games_pipeline
      # Daily at 06:00 Vilnius time. (Schedules are auto-paused in `mode: development`.)
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: Europe/Vilnius
      max_concurrent_runs: 1
      parameters:
        # How many days back (up to today) the bronze task fetches.
        # Backfill a season with:  databricks bundle run nba_games_pipeline --params days_back=350
        - name: days_back
          default: "2"
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - requests
      tasks:
        - task_key: bronze
          max_retries: 0
          environment_key: default
          spark_python_task:
            python_file: ./src/jobs/bronze.py
            parameters: ["--catalog", "${var.catalog}", "--days-back", "{{job.parameters.days_back}}"]
        - task_key: silver
          max_retries: 0
          depends_on:
            - task_key: bronze
          environment_key: default
          spark_python_task:
            python_file: ./src/jobs/silver.py
            parameters: ["--catalog", "${var.catalog}"]
        - task_key: gold
          max_retries: 0
          depends_on:
            - task_key: silver
          environment_key: default
          spark_python_task:
            python_file: ./src/jobs/gold.py
            parameters: ["--catalog", "${var.catalog}"]

  dashboards:
    nba_dashboard:
      display_name: NBA Games & Standings
      file_path: ./dashboards/nba_dashboard.lvdash.json
      warehouse_id: ${var.warehouse_id}
      # Lets the dataset queries refer to gold tables without a full name.
      dataset_catalog: ${var.catalog}
      dataset_schema: gold

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-7405611677912593.13.azuredatabricks.net
      profile: nba
