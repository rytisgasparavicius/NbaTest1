bundle:
  name: nba_analytics

variables:
  catalog:
    description: Unity Catalog catalog that receives the bronze/silver/gold schemas
    default: main
  season:
    description: NBA season to ingest, e.g. 2025-26
    default: "2025-26"
  warehouse_name:
    description: Name of the SQL warehouse that powers the dashboard
    default: Serverless Starter Warehouse
  warehouse_id:
    description: SQL warehouse id (resolved from warehouse_name)
    lookup:
      warehouse: ${var.warehouse_name}

resources:
  jobs:
    nba_standings_pipeline:
      name: nba_standings_pipeline
      # Daily at 06:00 Vilnius time. (Schedules are auto-paused in `mode: development`.)
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: Europe/Vilnius
      max_concurrent_runs: 1
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - nba_api
      tasks:
        - task_key: bronze
          environment_key: default
          spark_python_task:
            python_file: ./src/jobs/bronze.py
            parameters: ["--catalog", "${var.catalog}", "--season", "${var.season}"]
        - task_key: silver
          depends_on:
            - task_key: bronze
          environment_key: default
          spark_python_task:
            python_file: ./src/jobs/silver.py
            parameters: ["--catalog", "${var.catalog}", "--season", "${var.season}"]
        - task_key: gold
          depends_on:
            - task_key: silver
          environment_key: default
          spark_python_task:
            python_file: ./src/jobs/gold.py
            parameters: ["--catalog", "${var.catalog}", "--season", "${var.season}"]

  dashboards:
    nba_standings_dashboard:
      display_name: NBA Standings
      file_path: ./dashboards/nba_standings.lvdash.json
      warehouse_id: ${var.warehouse_id}
      # Lets the dataset queries refer to `team_standings_current` without a full name.
      dataset_catalog: ${var.catalog}
      dataset_schema: gold

targets:
  dev:
    mode: development
    default: true
    workspace:
      # Set to your workspace URL, e.g. https://adb-1234567890123456.7.azuredatabricks.net
      host: https://REPLACE-ME.cloud.databricks.com
